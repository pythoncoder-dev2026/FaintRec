name: Android Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Get version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets
        id: sign
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Keystore secrets missing. Building debug APK instead."
          fi

      - name: Decode keystore
        if: steps.sign.outputs.signed == 'true'
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release (APK + AAB)
        if: steps.sign.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Build debug APK (fallback)
        if: steps.sign.outputs.signed != 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect and rename outputs
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            cp "$(find . -path '*outputs/apk/release/*.apk' | head -n 1)" "dist/FaintRec-${VERSION}.apk"
            cp "$(find . -path '*outputs/bundle/release/*.aab' | head -n 1)" "dist/FaintRec-${VERSION}.aab"
          else
            cp "$(find . -path '*outputs/apk/debug/*.apk' | head -n 1)" "dist/FaintRec-${VERSION}-debug.apk"
          fi
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FaintRec-release-files
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
