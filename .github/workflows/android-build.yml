name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: FaintRec
  PACKAGE_NAME: com.faintrec.app
  VERSION_NAME: "1.0.0"
  VERSION_CODE: ${{ github.run_number }}
  DEFAULT_GRADLE_VERSION: "9.3.1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Detect project folder and Gradle version
        id: proj
        run: |
          SETTINGS="$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) not found. Project files are missing in the repo."
            ls -la
            exit 1
          fi
          DIR="$(dirname "$SETTINGS")"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          if [ -f "$DIR/gradlew" ]; then
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
          fi

          PROPS="$DIR/gradle/wrapper/gradle-wrapper.properties"
          GV=""
          if [ -f "$PROPS" ]; then
            GV="$(grep -oP 'gradle-\K[0-9.]+(?=-(bin|all))' "$PROPS" | head -n 1 || true)"
          fi
          if [ -z "$GV" ]; then
            GV="$DEFAULT_GRADLE_VERSION"
          fi
          echo "gradle=$GV" >> "$GITHUB_OUTPUT"

          echo "Project folder: $DIR"
          echo "Gradle version: $GV"
          ls -la "$DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.proj.outputs.gradle }}

      - name: Create debug keystore
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -d app ] && [ ! -f app/debug.keystore ]; then
            cp debug.keystore app/debug.keystore
          fi
          ls -la debug.keystore

      - name: Build info
        run: |
          echo "App: $APP_NAME"
          echo "Package: $PACKAGE_NAME"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          echo "Project dir: ${{ steps.proj.outputs.dir }}"
          echo "Gradle: ${{ steps.proj.outputs.gradle }}"
          echo "Using gradlew: ${{ steps.proj.outputs.wrapper }}"
          if [ -n "$DEV_PIN" ]; then
            echo "Developer Mode PIN: set"
          else
            echo "Developer Mode PIN: not set (Developer Mode will be disabled)"
          fi
        env:
          DEV_PIN: ${{ secrets.DEV_PIN }}

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          DEV_PIN: ${{ secrets.DEV_PIN }}
        run: |
          if [ "${{ steps.proj.outputs.wrapper }}" = "true" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug -PversionName=$VERSION_NAME -PversionCode=$VERSION_CODE --stacktrace
          else
            gradle assembleDebug -PversionName=$VERSION_NAME -PversionCode=$VERSION_CODE --stacktrace
          fi

      - name: Rename APK
        run: |
          mkdir -p dist
          APK="$(find . -path '*outputs/apk/debug/*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Debug APK not found"
            exit 1
          fi
          cp "$APK" "dist/${APP_NAME}-${VERSION_NAME}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION_NAME }}-debug
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore
